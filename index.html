    function formatPrice(raw) {
      const str = String(raw).trim();
      const match = str.match(/^(.*?)(\d+)$/);
      if (!match) return str;
      const prefix = match[1].trim();
      const num = Number(match[2]).toLocaleString('ru-RU');
      return (prefix ? prefix + ' ' : '') + num + ' сум';
    }

    function highlightText(text, tokens) {
      if (!tokens.length) return escapeHtml(text);
      const normText = normalize(text);
      const ranges = [];

      tokens.forEach(token => {
        if (!token) return;
        let idx = 0;
        while ((idx = normText.indexOf(token, idx)) !== -1) {
          ranges.push([idx, idx + token.length]);
          idx += token.length;
        }
      });

      if (!ranges.length) return escapeHtml(text);

      ranges.sort((a, b) => a[0] - b[0]);
      const merged = [ranges[0]];
      for (let i = 1; i < ranges.length; i++) {
        const prev = merged[merged.length - 1];
        if (ranges[i][0] <= prev[1]) {
          prev[1] = Math.max(prev[1], ranges[i][1]);
        } else {
          merged.push(ranges[i]);
        }
      }

      let result = '';
      let last = 0;
      merged.forEach(([start, end]) => {
        result += escapeHtml(text.slice(last, start));
        result += '<mark>' + escapeHtml(text.slice(start, end)) + '</mark>';
        last = end;
      });
      result += escapeHtml(text.slice(last));
      return result;
    }

    function showToast(msg) {

      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 1800);
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast('Скопировано: ' + text)).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('Скопировано: ' + text);
      } catch (e) {
        showToast('Не удалось скопировать');
      }
      document.body.removeChild(ta);
    }

      const query = normalize(searchInput.value);
      const selectedCat = categorySelect.value;
      const tokens = query ? query.split(/\s+/).filter(Boolean) : [];

      clearBtn.classList.toggle('hidden', !searchInput.value);

      const filtered = SERVICES.filter(item => {
        if (selectedCat && item.category !== selectedCat) return false;
        if (!tokens.length) return true;
        const tube = getTubeInfo(item);
        const haystack = normalize(item.name + ' ' + item.category + ' ' + tube.label);
        return tokens.every(t => haystack.includes(t));
      });

      counter.textContent = query || selectedCat
        ? `Найдено: ${filtered.length} из ${SERVICES.length}`
        : `Всего: ${SERVICES.length}`;

      if (!filtered.length) {
        resultsList.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      const fragment = document.createDocumentFragment();

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-white border border-slate-200 rounded-xl px-4 py-3 flex items-center justify-between gap-3 hover:border-teal-300 hover:shadow-sm transition cursor-pointer';
        card.title = 'Нажмите, чтобы скопировать';

        const priceFormatted = formatPrice(item.price);
        const tube = getTubeInfo(item);

        card.innerHTML = `
          <div class="min-w-0 flex-1">
            <div class="text-sm sm:text-base font-medium text-slate-900 leading-snug">${highlightText(item.name, tokens)}</div>
            <div class="flex flex-wrap items-center gap-2 mt-1.5">
              <span class="inline-flex items-center gap-1.5 text-xs font-medium px-2 py-0.5 rounded-md border ${tube.bg}">
                <span class="w-2 h-2 rounded-full shrink-0" style="background-color: ${tube.dot}"></span>
                ${escapeHtml(tube.label)}
              </span>
              <span class="text-xs text-slate-400 truncate">${escapeHtml(item.category)}</span>
            </div>
          </div>
          <div class="text-right shrink-0">
            <span class="inline-block text-sm sm:text-base font-bold text-teal-700 bg-teal-50 border border-teal-100 px-3 py-1 rounded-lg whitespace-nowrap">
              ${escapeHtml(priceFormatted)}
            </span>
          </div>
        `;

        card.addEventListener('click', () => {
          copyText(`${item.name} — ${priceFormatted}`);
        });

        fragment.appendChild(card);
      });

      resultsList.innerHTML = '';
      resultsList.appendChild(fragment);
    }

    searchInput.addEventListener('input', render);
    categorySelect.addEventListener('change', render);

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchInput.focus();
      render();
    });

    resetBtn.addEventListener('click', () => {
      searchInput.value = '';
      categorySelect.value = '';
      searchInput.focus();
      render();
    });

    document.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
    });

    render();
  </script>
</body>
</html>
